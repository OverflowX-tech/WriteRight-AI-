<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WriteRight AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 330px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f0b1a 0%, #1a1230 50%, #120e20 100%);
      color: #e8e4f0;
      padding: 26px 22px 22px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(108, 71, 255, 0.08) 0%, transparent 60%),
                  radial-gradient(circle at 20% 80%, rgba(167, 139, 250, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .header .logo { font-size: 26px; line-height: 1; }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #6c47ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 22px;
    }

    .status-card {
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .status-card.key-active {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .status-card.key-missing {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .status-card .status-icon {
      font-size: 20px;
      flex-shrink: 0;
      line-height: 1;
    }
    .status-card.key-active .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #4ade80;
    }
    .status-card.key-missing .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #f87171;
    }
    .status-card .status-sub {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
    }

    .config-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .config-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .config-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.45);
    }
    .key-link {
      font-size: 11px;
      color: #a78bfa;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .key-link:hover {
      color: #c4b5fd;
      text-decoration: underline;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0 10px;
      margin-bottom: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-wrapper:focus-within {
      border-color: rgba(167, 139, 250, 0.5);
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
    }
    #api-key-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e4f0;
      font-size: 13px;
      height: 36px;
      font-family: monospace;
    }
    #toggle-visibility-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      padding: 5px;
      transition: color 0.2s;
    }
    #toggle-visibility-btn:hover {
      color: rgba(255, 255, 255, 0.8);
    }
    .actions-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      height: 34px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: none;
    }
    .btn.primary {
      background: linear-gradient(135deg, #a78bfa, #6c47ff);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(108, 71, 255, 0.25);
    }
    .btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(108, 71, 255, 0.35);
    }
    .btn.primary:active {
      transform: translateY(0);
    }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
    }
    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .hidden {
      display: none !important;
    }

    .shortcuts {
      margin-bottom: 18px;
    }
    .shortcuts-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 10px;
    }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .shortcut-row:last-child { border-bottom: none; }
    .shortcut-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }
    kbd {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(108, 71, 255, 0.2);
      border: 1px solid rgba(108, 71, 255, 0.3);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 600;
      font-family: "Segoe UI", system-ui, monospace;
    }

    .footer {
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }
    .footer a {
      color: rgba(108, 71, 255, 0.7);
      text-decoration: none;
    }
    .footer a:hover { color: #9b6dff; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">✨</span>
    <h1>WriteRight AI</h1>
  </div>
  <p class="subtitle">AI-powered writing assistant for every text field</p>

  <div id="status-card" class="status-card key-missing">
    <span id="status-icon" class="status-icon">⚠️</span>
    <div>
      <div id="status-text" class="status-text">API Key Missing</div>
      <div id="status-sub" class="status-sub">Add a Groq API key to activate WriteRight</div>
    </div>
  </div>

  <div class="config-card">
    <div class="config-header">
      <span class="config-title">API Configuration</span>
      <a href="https://console.groq.com/keys" target="_blank" class="key-link">Get Key ↗</a>
    </div>
    
    <div class="input-group">
      <div class="input-wrapper">
        <input type="password" id="api-key-input" placeholder="Enter gsk_..." spellcheck="false" />
        <button type="button" id="toggle-visibility-btn" title="Toggle visibility">👁️</button>
      </div>
      <div class="actions-row">
        <button type="button" id="save-btn" class="btn primary">Save Key</button>
        <button type="button" id="clear-btn" class="btn secondary hidden">Clear</button>
      </div>
    </div>
  </div>

  <div class="shortcuts">
    <div class="shortcuts-title">Keyboard Shortcuts</div>
    <div class="shortcut-row">
      <span class="shortcut-label">👤 Normal Human</span>
      <kbd>Ctrl + 1</kbd>
    </div>
    <div class="shortcut-row">
      <span class="shortcut-label">💼 CEO Mode</span>
      <kbd>Ctrl + 2</kbd>
    </div>
    <div class="shortcut-row">
      <span class="shortcut-label">✨ Fix Button</span>
      <span class="shortcut-label" style="font-size:11px; color:rgba(255,255,255,0.35)">Type → click Fix</span>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://groq.com" target="_blank" rel="noopener">Groq</a> &middot; Llama 3
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
